server:
  port: 8080

spring:
  application:
    name: hire-agent-ats
  datasource:
    url: jdbc:h2:file:./data/ats;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

logging:
  level:
    org.hibernate.SQL: warn
