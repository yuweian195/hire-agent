services:
  ats:
    build: ./ats-service
    ports:
      - "8080:8080"
    volumes:
      - ./ats-service/data:/app/data

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      ATS_BASE_URL: http://ats:8080
    volumes:
      - ./data:/app/data
    depends_on:
      - ats

  ui:
    build: .
    command: streamlit run ui/streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    env_file:
      - path: .env
        required: false
    environment:
      ATS_BASE_URL: http://ats:8080
    volumes:
      - ./data:/app/data
    depends_on:
      - api
